name: AI Agent

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "AI Agent is starting..."

          RESPONSE=$(curl -s https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent \
            -H "Content-Type: application/json" \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            -d '{
              "contents": [
                {
                  "parts": [
                    {
                      "text": "حلل XAUUSD وأعطني سيناريو شراء وسيناريو بيع، مع نقطة الدخول ووقف الخسارة وجني الأرباح، بناءً على الدعم والمقاومة."
                    }
                  ]
                }
              ]
            }')

          echo "$RESPONSE"
