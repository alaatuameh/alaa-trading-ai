<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Agent</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .chat {
      width: 100%;
      max-width: 600px;
      height: 90vh;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      background: #111827;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 21px;
      font-weight: bold;
    }
    .status { font-size: 13px; font-weight: normal; opacity: 0.7; }
    #messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
    }
    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      margin-bottom: 10px;
      line-height: 1.5;
      white-space: pre-line;
    }
    .message.user {
      background: #2563eb;
      color: white;
      margin-left: auto;
    }
    .message.agent {
      background: #e5e7eb;
      color: #111827;
      margin-right: auto;
    }
    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #eee;
    }
    #input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }
    button {
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; }
    #mic { background: #059669; }
  </style>
</head>
<body>
  <div class="chat">
    <div class="header">
      AI Agent 🤖
      <div class="status">وكيل التداول الذكي</div>
    </div>
    <div id="messages">
      <div class="message agent">أهلاً 👋 أنا وكيلك الذكي لتحليل الذهب. اكتبلي "حلل الذهب" أو اضغط الميكروفون.</div>
    </div>
    <div class="input-area">
      <input id="input" type="text" placeholder="اكتب رسالتك هنا..." autocomplete="off" />
      <button id="mic" type="button">🎤</button>
      <button id="send">إرسال</button>
    </div>
  </div>
  <audio id="player" style="display:none"></audio>

  <script>
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const mic = document.getElementById("mic");
    const messages = document.getElementById("messages");
    const player = document.getElementById("player");

    const AGENT_URL = "https://py-code--alaatuameh.replit.app/analyze";

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "message " + type;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    // ===== صوت احترافي عبر خدمة نطق حقيقية =====
    function chunkText(text, maxLen) {
      const parts = [];
      let remaining = text.replace(/\n/g, ". ");
      while (remaining.length > 0) {
        if (remaining.length <= maxLen) {
          parts.push(remaining);
          break;
        }
        let cut = remaining.lastIndexOf(" ", maxLen);
        if (cut <= 0) cut = maxLen;
        parts.push(remaining.slice(0, cut));
        remaining = remaining.slice(cut).trim();
      }
      return parts;
    }

    async function playChunks(chunks, index) {
      if (index >= chunks.length) return;
      const url = "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=ar&q=" + encodeURIComponent(chunks[index]);
      player.src = url;
      try {
        await player.play();
      } catch (e) {
        speakFallback(chunks[index]);
      }
      player.onended = function () {
        playChunks(chunks, index + 1);
      };
    }

    function speakFallback(text) {
      if (!window.speechSynthesis) return;
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "ar-SA";
      window.speechSynthesis.speak(utter);
    }

    function speak(text) {
      const chunks = chunkText(text, 180);
      playChunks(chunks, 0);
    }

    function formatDecision(data) {
      const decision = data.decision || "غير معروف";
      const price = data.current_price ? Number(data.current_price).toFixed(2) : "غير متوفر";

      let decisionAr = decision;
      if (decision === "NO TRADE") decisionAr = "لا توجد صفقة الآن";
      else if (decision === "BUY") decisionAr = "شراء";
      else if (decision === "SELL") decisionAr = "بيع";

      let trendAr = "";
      if (data.reason && data.reason.includes("trend = UP")) trendAr = "الاتجاه العام صاعد";
      else if (data.reason && data.reason.includes("trend = DOWN")) trendAr = "الاتجاه العام هابط";
      else trendAr = "الاتجاه العام غير واضح";

      return "القرار: " + decisionAr + "\nالسعر الحالي: " + price + "\n" + trendAr;
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, "user");
      input.value = "";
      send.disabled = true;
      send.textContent = "...";

      try {
        const response = await fetch(AGENT_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });

        const raw = await response.text();
        let data;
        try {
          data = JSON.parse(raw);
        } catch (e) {
          data = { reply: raw };
        }

        let replyText;
        if (data.decision) {
          replyText = formatDecision(data);
        } else {
          replyText = data.reply || data.message || data.response || data.text || data.output || raw;
        }

        addMessage(replyText, "agent");
        speak(replyText);

      } catch (error) {
        const errMsg = "ما قدرت أتصل بالوكيل حالياً. تأكد أن السيرفر شغال.";
        addMessage(errMsg, "agent");
      }

      send.disabled = false;
      send.textContent = "إرسال";
      input.focus();
    }

    send.addEventListener("click", sendMessage);
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") sendMessage();
    });

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = "ar-SA";
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      let isListening = false;

      mic.addEventListener("click", function () {
        if (isListening) return;
        try {
          recognition.start();
          isListening = true;
          mic.textContent = "🔴";
        } catch (err) {
          isListening = false;
        }
      });

      recognition.onresult = function (event) {
        const transcript = event.results[0][0].transcript;
        input.value = transcript;
        mic.textContent = "🎤";
        isListening = false;
        sendMessage();
      };

      recognition.onerror = function () {
        mic.textContent = "🎤";
        isListening = false;
      };

      recognition.onend = function () {
        mic.textContent = "🎤";
        isListening = false;
      };
    } else {
      mic.style.display = "none";
    }
  </script>
</body>
</html>
