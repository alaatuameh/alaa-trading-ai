<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Agent</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .chat {
      width: 100%;
      max-width: 600px;
      height: 90vh;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      background: #111827;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 21px;
      font-weight: bold;
    }
    .status { font-size: 13px; font-weight: normal; opacity: 0.7; }
    #messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
    }
    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      margin-bottom: 10px;
      line-height: 1.5;
      white-space: pre-line;
    }
    .message.user {
      background: #2563eb;
      color: white;
      margin-left: auto;
    }
    .message.agent {
      background: #e5e7eb;
      color: #111827;
      margin-right: auto;
    }
    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #eee;
    }
    #input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }
    button {
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; }
    #mic { background: #059669; }
  </style>
</head>
<body>
  <div class="chat">
    <div class="header">
      AI Agent 🤖
      <div class="status">وكيل التداول الذكي</div>
    </div>
    <div id="messages">
      <div class="message agent">أهلاً 👋 أنا وكيلك الذكي لتحليل الذهب. اكتبلي "حلل الذهب" أو اضغط الميكروفون.</div>
    </div>
    <div class="input-area">
      <input id="input" type="text" placeholder="اكتب رسالتك هنا..." autocomplete="off" />
      <button id="mic" type="button">🎤</button>
      <button id="send">إرسال</button>
    </div>
  </div>

  <script>
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const mic = document.getElementById("mic");
    const messages = document.getElementById("messages");

    const AGENT_URL = "https://py-code--alaatuameh.replit.app/analyze";

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "message " + type;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    // ===== اختيار صوت رجالي عربي =====
    let cachedVoices = [];
    let chosenVoice = null;

    function pickMaleArabicVoice() {
      const voices = window.speechSynthesis.getVoices();
      if (!voices || voices.length === 0) return null;
      cachedVoices = voices;

      const arabicVoices = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith("ar"));

      const maleKeywords = ["male", "man", "rgل", "hamed", "majed", "tarik", "naayf", "husam", "abdullah"];
      let male = arabicVoices.find(v =>
        maleKeywords.some(k => v.name.toLowerCase().includes(k))
      );
      if (male) return male;

      const femaleKeywords = ["female", "woman", "salma", "amira", "laila", "hoda", "zeina"];
      const notFemale = arabicVoices.find(v =>
        !femaleKeywords.some(k => v.name.toLowerCase().includes(k))
      );
      if (notFemale) return notFemale;

      return arabicVoices[0] || null;
    }

    if (window.speechSynthesis) {
      window.speechSynthesis.onvoiceschanged = function () {
        chosenVoice = pickMaleArabicVoice();
      };
      chosenVoice = pickMaleArabicVoice();
    }

    function speak(text) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "ar-SA";
      utter.pitch = 0.75;
      utter.rate = 0.95;
      if (chosenVoice) utter.voice = chosenVoice;
      window.speechSynthesis.speak(utter);
    }

    function formatDecision(data) {
      const decision = data.decision || "غير معروف";
      const price = data.current_price ? Number(data.current_price).toFixed(2) : "غير متوفر";
      const reason = data.reason || "";

      let decisionAr = decision;
      if (decision === "NO TRADE") decisionAr = "لا توجد صفقة الآن";
      else if (decision === "BUY") decisionAr = "شراء";
      else if (decision === "SELL") decisionAr = "بيع";

      return "القرار: " + decisionAr + "\nالسعر الحالي: " + price + "\nالسبب: " + reason;
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, "user");
      input.value = "";
      send.disabled = true;
      send.textContent = "...";

      try {
        const response = await fetch(AGENT_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });

        const raw = await response.text();
        let data;
        try {
          data = JSON.parse(raw);
        } catch (e) {
          data = { reply: raw };
        }

        let replyText;
        if (data.decision) {
          replyText = formatDecision(data);
        } else {
          replyText = data.reply || data.message || data.response || data.text || data.output || raw;
        }

        addMessage(replyText, "agent");
        speak(replyText);

      } catch (error) {
        const errMsg = "ما قدرت أتصل بالوكيل حالياً. تأكد أن السيرفر شغال.";
        addMessage(errMsg, "agent");
      }

      send.disabled = false;
      send.textContent = "إرسال";
      input.focus();
    }

    send.addEventListener("click", sendMessage);
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") sendMessage();
    });

    // ===== الميكروفون =====
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = "ar-SA";
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      let isListening = false;

      mic.addEventListener("click", function () {
        if (isListening) return;
        try {
          recognition.start();
          isListening = true;
          mic.textContent = "🔴";
        } catch (err) {
          isListening = false;
        }
      });

      recognition.onresult = function (event) {
        const transcript = event.results[0][0].transcript;
        input.value = transcript;
        mic.textContent = "🎤";
        isListening = false;
        sendMessage();
      };

      recognition.onerror = function () {
        mic.textContent = "🎤";
        isListening = false;
      };

      recognition.onend = function () {
        mic.textContent = "🎤";
        isListening = false;
      };
    } else {
      mic.style.display = "none";
    }
  </script>
</body>
</html>
