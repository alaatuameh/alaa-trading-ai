<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Agent</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .chat {
      width: 100%;
      max-width: 600px;
      height: 90vh;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      background: #111827;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 21px;
      font-weight: bold;
    }
    .status { font-size: 13px; font-weight: normal; opacity: 0.7; }
    #messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
    }
    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      margin-bottom: 10px;
      line-height: 1.5;
    }
    .message.user {
      background: #2563eb;
      color: white;
      margin-left: auto;
    }
    .message.agent {
      background: #e5e7eb;
      color: #111827;
      margin-right: auto;
    }
    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #eee;
    }
    #input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }
    button {
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; }
    #mic { background: #059669; }
  </style>
</head>
<body>
  <div class="chat">
    <div class="header">
      AI Agent 🤖
      <div class="status">وكيل التداول الذكي</div>
    </div>
    <div id="messages">
      <div class="message agent">أهلاً 👋 أنا وكيلك الذكي. اكتبلي أو احكيلي أي شيء وخلينا نبدأ.</div>
    </div>
    <div class="input-area">
      <input id="input" type="text" placeholder="اكتب رسالتك هنا..." autocomplete="off" />
      <button id="mic" type="button">🎤</button>
      <button id="send">إرسال</button>
    </div>
  </div>

  <script>
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const mic = document.getElementById("mic");
    const messages = document.getElementById("messages");

    const AGENT_URL = "https://script.google.com/macros/s/AKfycbwjvX7OYLLkZN98JF-8mjNPDDf1NIQmg9j8X2bWQfzXlxXhG_MMT5IIB8-xWCy1oOc7/exec";

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "message " + type;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function speak(text) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "ar-SA";
      window.speechSynthesis.speak(utter);
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, "user");
      input.value = "";
      send.disabled = true;
      send.textContent = "...";

      try {
        const response = await fetch(AGENT_URL, {
          method: "POST",
          body: JSON.stringify({ message: text })
        });

        const raw = await response.text();
        let data;
        try {
          data = JSON.parse(raw);
        } catch (e) {
          data = { reply: raw };
        }

        const replyText = data.reply || data.message || data.response || data.text || data.output || raw;
        addMessage(replyText, "agent");
        speak(replyText);

      } catch (error) {
        const errMsg = "ما قدرت أتصل بالوكيل حالياً. تأكد أن السيرفر شغال. (" + error.message + ")";
        addMessage(errMsg, "agent");
      }

      send.disabled = false;
      send.textContent = "إرسال";
      input.focus();
    }

    send.addEventListener("click", sendMessage);
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") sendMessage();
    });

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = "ar-SA";
      recognition.continuous = false;
      recognition.interimResults = false;

      mic.addEventListener("click", function () {
        recognition.start();
        mic.textContent = "🔴";
      });

      recognition.onresult = function (event) {
        input.value = event.results[0][0].transcript;
        mic.textContent = "🎤";
        sendMessage();
      };

      recognition.onerror = function () {
        mic.textContent = "🎤";
      };

      recognition.onend = function () {
        mic.textContent = "🎤";
      };
    } else {
      mic.style.display = "none";
    }
  </script>
</body>
</html>
